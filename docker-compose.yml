services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: denai_murah_app
    environment:
      APP_ENV: production
    volumes:
      - ./:/var/www
      - denai_murah_build:/var/www/public
    networks:
      - app_network

networks:
  app_network:
    external: true

volumes:
  denai_murah_build:
    external: true
