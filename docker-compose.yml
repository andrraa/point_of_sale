services:
  app_pos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos-php
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - pos-build:/var/www/public/build
    networks:
      - pos-network
      - proxy-net

networks:
  pos-network:
  proxy-net:
    external: true

volumes:
  pos-build:
